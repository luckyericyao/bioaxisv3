name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Build
        run: npm run build
      - name: Offline regressions
        # Browser and HTTP regressions keep their separate test:* commands.
        run: npm test
